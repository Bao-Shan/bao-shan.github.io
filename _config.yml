# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
title                    : "Bao-Shan Wang"
description              : "Associate Professor, School of Mathematical Sciences, Ocean University of China | High-order Numerical Methods for Hyperbolic Conservation Laws"
repository               : "baoshan/baoshan.github.io"
google_scholar_stats_use_cdn : true

# google analytics
google_analytics_id      :  # Get from https://analytics.google.com/

# SEO Related
google_site_verification :  # Get from https://search.google.com/search-console/
bing_site_verification   :  # Get from https://www.bing.com/webmasters/
baidu_site_verification  :  # Get from https://ziyuan.baidu.com/

# Site Author
author:
  name             : "Bao-Shan Wang (王保山)"
  avatar           : "images/baoshan.jpg"
  bio              : "Associate Professor, School of Mathematical Sciences, Ocean University of China"
  location         : "Qingdao, China"
  employer         : "Ocean University of China"
  pubmed           : 
  googlescholar    : "https://scholar.google.com/citations?user=TiPSLVsAAAAJ"
  email            : "wbs@ouc.edu.cn"
  researchgate     : "https://www.researchgate.net/profile/Baoshan-Wang"
  uri              : "https://baoshan.github.io"
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : "baoshan"
  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :
  linkedin         :
  dblp             :
  orcid            : "https://orcid.org/0009-0007-8744-0648"
  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          : 
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji


# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
